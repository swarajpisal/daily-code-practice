<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>09 - DOM Basics</title>
</head>
<body>
  <h1 id="heading">DOM Basics</h1>

  <div id="box" class="card main">
    <p class="para">First para</p>
    <p class="para" id="second">Second <b>bold</b> para</p>
    <span class="para">Span text</span>
  </div>

  <ul id="list">
    <li class="item">One</li>
    <li class="item active">Two</li>
    <li class="item">Three</li>
  </ul>

  <a id="link" href="https://example.com" title="Example">Link</a>
  <img id="pic" src="logo.png" alt="logo" class="img" />
  <div id="styled" style="color: red; font-size: 20px;">Styled box</div>
  <button id="btn" class="btn primary">Click</button>
  <p id="remove-me">Remove me</p>

  <script src="script.js"></script>
</body>
</html>
